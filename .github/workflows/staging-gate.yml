# Promotion path: feature → dev → staging → main.
#
# PRs into `staging` must come from `dev` in this repo. The `staging` ruleset
# requires this check, so a PR from anywhere else can't be merged. Merging
# dev → staging is what cuts the android-dev.<run#> prerelease + Play
# internal release (android.yml) and the desktop dev build (desktop-gui.yml).

name: Staging branch source gate

# pull_request_target (not pull_request) on purpose: the workflow then comes
# from the base branch, so a PR can't edit this file to make its own check
# pass. Safe here because the job never checks out or runs PR code - it only
# reads event metadata.
on:
  pull_request_target:
    branches: [staging]

permissions:
  contents: read

jobs:
  enforce-source-is-dev:
    name: enforce-source-is-dev
    runs-on: ubuntu-latest
    steps:
      - name: Check PR head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Bootstrap: until the source branch exists there is nothing to
          # promote from, so the gate can't apply yet. Pass with a warning.
          if ! gh api "repos/$BASE_REPO/branches/dev" --silent 2>/dev/null; then
            echo "::warning::Branch 'dev' does not exist yet in $BASE_REPO - source gate not applied."
            exit 0
          fi
          # The branch name alone isn't enough: a fork could open a PR from a
          # branch literally named "dev". Pin the head repo too.
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error title=PR source must be this repo::PRs to staging must come from dev in $BASE_REPO, not a fork ($HEAD_REPO)."
            exit 1
          fi
          if [[ "$HEAD_REF" != "dev" ]]; then
            echo "::error title=PR source must be dev::PRs to staging are only allowed from dev (got '$HEAD_REF')."
            echo "Land the change on dev first (PR feature → dev), then open dev → staging to cut an internal release."
            exit 1
          fi
          echo "OK — PR source is dev in $BASE_REPO."
