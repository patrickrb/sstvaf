# Promotion path: feature -> dev -> main (the staging branch is retired).
#
# PRs into `main` must come from `dev` in this repo. Merging dev -> main is the
# release: android.yml publishes the build to the Play internal track and
# desktop-gui.yml cuts a desktop prerelease. Production stays a separate,
# deliberate step that only Patrick takes (Play Console promotion, or an
# android-v* / desktop-v* tag he pushes).
#
# main's branch protection requires `enforce-source-is-dev`.

name: Main branch source gate

# pull_request_target (not pull_request) on purpose: the workflow then comes
# from the base branch, so a PR can't edit this file to make its own check
# pass. Safe here because the job never checks out or runs PR code - it only
# reads event metadata. Bootstrap (2026-11-13): the first dev -> main release
# ran main's old staging-era copy, which rejects a dev head, so for that one
# merge the source-gate requirement was lifted, then set to
# enforce-source-is-dev once this copy was on main.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce-source-is-dev:
    name: enforce-source-is-dev
    runs-on: ubuntu-latest
    steps:
      - name: Check PR head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The branch name alone isn't enough: a fork could open a PR from a
          # branch literally named "dev". Pin the head repo too.
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error title=PR source must be this repo::PRs to main must come from dev in $BASE_REPO, not a fork ($HEAD_REPO)."
            exit 1
          fi
          if [[ "$HEAD_REF" != "dev" ]]; then
            echo "::error title=PR source must be dev::PRs to main are only allowed from dev (got '$HEAD_REF')."
            echo "Land the change on dev first (PR feature -> dev), then open dev -> main to release."
            exit 1
          fi
          echo "OK — PR source is dev in $BASE_REPO."
