[package]
name = "sstvaf"
version = "0.1.0"
edition = "2021"
description = "SSTVAF desktop — slow-scan television transceiver client"
license = "GPL-3.0-or-later"

[lib]
name = "sstvaf"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# audio capture + resampling to the codec's 12 kHz rate
cpal = "0.15"
rubato = "0.15"
ringbuf = "0.4"
# auto-save of completed decodes: PNG encoding + UTC filename timestamps.
# Both already in the dependency graph transitively, so this adds nothing new.
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# The clean-room SSTV codec (cpp/sstv_lib) is compiled from source in build.rs
# via the `cc` crate — the same C the Android app runs through JNI, with no
# prebuilt artifact, so it links natively on Windows/macOS/Linux.
[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
