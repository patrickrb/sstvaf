# Robolectric emulates API 35 even though the app targets 36.
#
# Google Play requires targetSdk 36 for new releases, but no published
# Robolectric supports it: 4.15.1 is the newest release and still reports
# maxSdkVersion=35, so every Robolectric test fails at configuration time with
# "Package targetSdkVersion=36 > maxSdkVersion=35" unless an SDK is named here.
#
# 35 is the highest Robolectric can actually emulate, so this is the closest to
# the shipped target that runs. These are unit tests of app logic, not of
# platform behaviour changes between 35 and 36 - the Android 16 changes that
# matter here (enforced edge-to-edge, predictive back) are UI behaviour that a
# JVM test never exercised in the first place, and they are covered by the
# device sweep in docs/ui-testing.md.
#
# Remove this file once Robolectric ships API 36 support.
sdk=35
